name: Update dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "litter-log.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write app profile
        env:
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
        run: printf '%s' "$APP_PROFILE" > petsafe-app-profile.json

      - name: Fetch visits
        env:
          PETSAFE_EMAIL: ${{ secrets.PETSAFE_EMAIL }}
          PETSAFE_PASSWORD: ${{ secrets.PETSAFE_PASSWORD }}
        run: python fetch_ci.py

      - name: Build dashboard
        run: python tracker.py

      - name: Commit visit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add litter-log.json
          if git diff --staged --quiet; then
            echo "No litter-log.json changes to commit."
          else
            git commit -m "Update litter-log.json"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
